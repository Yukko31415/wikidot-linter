name: 'Build'

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      # ========================================
      # 1. 各OSでSBCLを直接インストール
      # ========================================
      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install -y sbcl

      # ========================================
      # 2. ビルド実行 (setup.lispを作らずにワンライナーで完結)
      # ========================================
      - name: Build Executable
        shell: bash
        run: |
          sbcl --non-interactive \
               --eval '(require :asdf)' \
               --eval '(require :uiop)' \
               --eval '(asdf:initialize-source-registry (list :source-registry :inherit-configuration (list :tree (uiop:getcwd))))' \
               --eval '(asdf:make :wikidot-linter)'

      # ========================================
      # 3. アーティファクトの回収
      # ========================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikidot-linter-${{ matrix.os }}
          path: |
            wikilinter
            wikilinter.exe